# CI（生产化改造第三批）
#
# 后端：uv 安装依赖后跑全部 pytest 用例（conftest 注入占位密钥，
#       不需要真实 LLM/Tavily/MySQL 服务）。
# 前端：pnpm 安装依赖后跑 TypeScript 类型检查。
#
# 触发：push 到任意分支 + 针对 main 的 PR。
#
# 注：此处原为 [main, production-hardening]，但 production-hardening 分支并不存在
# （git branch -a 仅 main），属失效配置，2026-09-05 移除。

name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: python -m uv sync --group dev

      - name: Run tests
        run: python -m uv run pytest tests/ -q

      # 评测集结构自检（零依赖、不需要真实模型/数据库）：
      # 校验用例总数、分类分布、id 唯一性与各类必备字段，
      # 防止对 eval/cases.py 的数据改动破坏评测集结构。
      # 注意：全量评测（eval/runner.py）需要真实 OPENAI/TAVILY/MySQL，
      # 不进 CI，仍按 eval/README.md 在本地手动运行。
      - name: Eval cases structure check
        run: python -m uv run python eval/cases.py

  frontend:
    name: Frontend typecheck (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -b
