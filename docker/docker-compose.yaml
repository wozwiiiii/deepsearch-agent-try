# DeepSearch Agents 本地 MySQL 教学环境
#
# 运行位置：在 docker 目录执行 docker compose up -d。
# 首次启动时，mysql/mysql.sql 会被官方镜像自动导入到 deepsearch_db。
# 如果数据卷已存在，MySQL 不会重复执行初始化脚本，需要重建 volume 才会重新导入。

name: deepsearch-agents

services:
  mysql:
    image: mysql:8.4
    container_name: deepsearch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deepsearch_db}
      # 应用只读账号密码：初始化脚本 02-create-readonly-user.sh 使用
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD:-deepsearch_ro_dev}
      TZ: Asia/Shanghai
    # 与 Python 连接配置保持一致，避免中文字段或日期时间在导入、查询时出现偏差
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --sql-mode=TRADITIONAL
    ports:
      # .env.example 默认使用 3307，避免和本机已有 MySQL 的 3306 端口冲突
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - deepsearch_mysql_data:/var/lib/mysql
      # 只读挂载初始化 SQL，容器首次创建数据目录时会自动执行
      - ./mysql/mysql.sql:/docker-entrypoint-initdb.d/01-init-pharma.sql:ro
      # 02 号脚本创建仅有 SELECT 权限的应用账号 deepsearch_ro（纵深防御第二层）
      - ./mysql/02-create-readonly-user.sh:/docker-entrypoint-initdb.d/02-create-readonly-user.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # P0-2 阶段 1：任务状态外置（tasks 表）+ AsyncPostgresSaver checkpointer。
  # 仅 TASK_QUEUE_MODE=redis 时需要；inline 默认模式不依赖这两个服务
  postgres:
    image: postgres:16-alpine
    container_name: deepsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepsearch
      POSTGRES_PASSWORD: deepsearch
      POSTGRES_DB: deepsearch_tasks
      TZ: Asia/Shanghai
    ports:
      # 默认映射 5433，避免和本机已有 Postgres 的 5432 冲突（与 .env.example 一致）
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - deepsearch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepsearch"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # P0-2 阶段 1：ARQ 任务队列（Agent 执行出进程）
  redis:
    image: redis:7-alpine
    container_name: deepsearch-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - deepsearch_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  deepsearch_mysql_data:
  deepsearch_pg_data:
  deepsearch_redis_data:
